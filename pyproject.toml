[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moon2024"
version = "0.1.0"
description = "Replication of Moon et al. (2024), PLOS ONE 19(11): e0307654"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Preinstalled on Kaggle; versions used are recorded with each run's output
models = ["scikit-learn", "xgboost", "lightgbm", "catboost"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
